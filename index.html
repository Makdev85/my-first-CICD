<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akbar Bhai | CI/CD Deployment</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, #153b4d 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #162d4d 0%, transparent 35%),
        linear-gradient(135deg, #020617, #07111f, #020617);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(56, 189, 248, 0.12);
      filter: blur(120px);
      border-radius: 50%;
      animation: glow 6s ease-in-out infinite alternate;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 900px;
      padding: 60px 40px;
      text-align: center;

      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      backdrop-filter: blur(15px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.5),
        0 0 50px rgba(56, 189, 248, 0.08);

      animation: fadeIn 1.2s ease;
    }

    .status {
      display: inline-block;
      padding: 8px 18px;
      margin-bottom: 25px;
      border-radius: 50px;
      border: 1px solid rgba(74, 222, 128, 0.5);
      background: rgba(34, 197, 94, 0.1);
      color: #86efac;
      font-size: 14px;
      letter-spacing: 2px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 80px);
      letter-spacing: -3px;
      margin-bottom: 18px;

      background: linear-gradient(90deg, #ffffff, #7dd3fc, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 20px;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .pipeline {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      color: #cbd5e1;
      font-weight: bold;
    }

    .tech {
      padding: 12px 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .arrow {
      color: #38bdf8;
      font-size: 22px;
    }

    .footer {
      margin-top: 40px;
      color: #64748b;
      font-size: 13px;
      letter-spacing: 1px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes glow {
      from {
        transform: translate(-150px, -80px);
      }

      to {
        transform: translate(150px, 80px);
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 40px 20px;
      }

      .pipeline {
        flex-direction: column;
      }

      .arrow {
        transform: rotate(90deg);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="status">
      ● DEPLOYMENT SUCCESSFUL
    </div>

    <h1>Akbar Bhai</h1>

    <p class="subtitle">
      My First Kubernetes CI/CD Deployment 🚀
      <br>
      Automatically built, shipped and deployed through a modern DevOps pipeline.
    </p>

    <div class="pipeline">

      <div class="tech">GitHub</div>

      <div class="arrow">→</div>

      <div class="tech">GitHub Actions</div>

      <div class="arrow">→</div>

      <div class="tech">Docker</div>

      <div class="arrow">→</div>

      <div class="tech">Kubernetes</div>

    </div>

    <div class="footer">
      AUTOMATED CI/CD • CONTAINERIZED • KUBERNETES
    </div>

  </div>

</body>
</html>
